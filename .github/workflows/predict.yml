name: Daily predictions

on:
  schedule:
    - cron: "0 7 * * *"   # ogni giorno alle 07:00 UTC
  workflow_dispatch:       # avvio manuale da Actions → Run workflow

permissions:
  contents: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests pandas numpy scipy

      - name: Generate predictions
        env:
          FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
        run: python scripts/generate_static.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/predictions.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "chore: aggiorna previsioni $(date -u +%Y-%m-%d)"
            git push
          fi
