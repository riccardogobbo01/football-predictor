name: Weekly stack training

on:
  schedule:
    - cron: "0 5 * * 1"   # ogni lunedì alle 05:00 UTC
  workflow_dispatch:       # avvio manuale da Actions → Run workflow

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests pandas numpy scipy scikit-learn

      - name: Train Poisson-stack
        run: python scripts/train_stack.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add models/stack.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "chore: riallena stack $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
